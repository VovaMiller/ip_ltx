version: 2

sphinx:
  configuration: docs/source/conf.py

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    post_create_environment:
      - pip install -e .
      - pip install sphinx sphinx-pyproject myst-parser furo
    post_build:
      - sphinx-apidoc -f -e -M -o docs/source/ src/ip_ltx/
