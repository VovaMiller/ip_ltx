[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ip_ltx"
version = "3.8.2"
description = "Python utils for working with S.T.A.L.K.E.R. SoC ltx-files"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [
    {name = "Vova Miller", email = "vovamiller_97@mail.ru"},
]
dependencies = [
    "pygtrie>=2.5.0",
    "pathvalidate>=3.3.1",
    "networkx>=3.6.1",
]

[project.urls]
"Homepage" = "https://github.com/VovaMiller/ip_ltx"
"Bug Reports" = "https://github.com/VovaMiller/ip_ltx/issues"
"Funding" = "https://vk.cc/ccolu7"
"Source" = "https://github.com/VovaMiller/ip_ltx"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]
extend-exclude = [
    ".pytest_cache/",
    "backup/",
    "docs/",
    "*.egg-info",
    "*.egg",
    "__pycache__",
]

[tool.ruff.lint]
# select = ["ALL"]
# select = ["E", "W", "F", "I", "B", "C4"]
select = [
    "E",    # pycodestyle errors (standard syntax checking)
    "W",    # pycodestyle warnings (formatting/style issues)
    "F",    # Pyflakes (catches logical bugs like unused variables/imports)
    "I",    # isort (automatically sorts imports alphabetically)
    "N",    # pep8-naming (enforces camelCase for classes, snake_case for functions)
    "UP",   # pyupgrade (automatically modernizes older Python syntax)
    "B",    # flake8-bugbear (catches subtle, common Python design flaws)
    "C4",   # flake8-comprehensions (optimizes list/dict comprehensions)
    "SIM",  # flake8-simplify (helps to refactor complex code into simpler lines)
    "ARG",  # flake8-unused-arguments (flags unused parameters in functions)
    "PTH",  # flake8-use-pathlib (encourages modern pathlib instead of raw os.path strings)
    "RUF",  # Ruff-specific rules (catches hidden bugs unique to Ruff's deep analysis)
]
ignore = [
    "UP032",  # Don't force f-strings

    # Mute ambiguous character checks
    "RUF001",  # Checks inside raw strings
    "RUF002",  # Checks inside docstrings
    "RUF003",  # Checks inside code comments
]

[tool.ruff.lint.per-file-ignores]
"tests/test_*.py" = [
    "E501",  # Allowing long lines
]
